name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manazir-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: JDK ${{ matrix.java }} / Maven verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["22", "25"]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install FFmpeg toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify build and tests
        run: mvn --batch-mode --no-transfer-progress clean verify
